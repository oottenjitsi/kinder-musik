name: Android-App bauen

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK bauen
        run: gradle -p android assembleRelease --no-daemon
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk Kinder-Musik.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Kinder-Musik App (Version ${{ github.run_number }})
          body: "Zum Installieren auf dem Android-Handy: Kinder-Musik.apk herunterladen und öffnen."
          files: Kinder-Musik.apk
          make_latest: true
